services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/temp:/app/temp
    environment:
      - TEMP_DIR=/app/temp
      - CORS_ORIGINS=http://localhost:3000
      - DEMUCS_MODEL=htdemucs
      - WHISPER_MODEL=base
      - DEVICE=auto
      - JOB_TTL_HOURS=24
      - MAX_UPLOAD_SIZE_MB=100
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    restart: unless-stopped

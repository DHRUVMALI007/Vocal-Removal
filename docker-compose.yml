services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/temp:/app/temp
    environment:
      - TEMP_DIR=/app/temp
      - CORS_ORIGINS=http://localhost:3000
      - DEMUCS_MODEL=htdemucs
      - DEMUCS_OVERLAP=0.15
      - DEMUCS_SHIFTS=0
      - WHISPER_MODEL=base
      - WHISPER_BEAM_SIZE=1
      - WHISPER_VAD_MIN_SILENCE_MS=500
      - WHISPER_CONDITION_ON_PREVIOUS_TEXT=false
      - DEVICE=auto
      - JOB_TTL_HOURS=24
      - MAX_UPLOAD_SIZE_MB=100
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
